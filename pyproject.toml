[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mt-catalogue"
version = "0.0.2"
description = "Python client for MTCAT-conformant magnetotelluric data portals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ben Kay" }]
dependencies = ["requests>=2.28", "jsonschema>=4.18"]
keywords = ["magnetotellurics", "MTCAT", "geophysics", "metadata", "catalogue"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Source = "https://github.com/bvkay/mt-catalogue"
Specification = "https://ausmt.auscope.org.au/"

[project.entry-points."mtcatalogue.profiles"]
ausmt = "mtcatalogue.profiles.ausmt:AusmtProfile"

[tool.hatch.build.targets.wheel]
packages = ["src/mtcatalogue"]

[tool.ruff]
line-length = 100
