name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest ruff
      - run: ruff check src tests
      - run: pytest -q
      # the examples run offline against the fixtures, so they can never rot
      - run: python examples/list_holdings.py tests/fixtures/mtcat-ts-snapshot.json
      - run: python examples/station_detail.py au.x.Y tests/fixtures/mtcat-ts-snapshot.json || test $? -eq 1
      # portal conventions stay in profiles: the core must never name a portal
      - run: "! grep -rn ausmt src/mtcatalogue --include='*.py' | grep -v profiles/"
